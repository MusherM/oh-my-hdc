[package]
name = "omh"
version = "0.1.0"
edition = "2024"
description = "Per-user HarmonyOS device scheduling for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
directories = "6"
command-group = "5"
toml_edit = "0.23"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
